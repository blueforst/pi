name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Iris fork provenance gate runs before build/full check so it cannot be
      # short-circuited by pre-existing failures further down the check chain.
      # The gate verifies acceptedRuntime.commit/tree in the local object store;
      # a shallow PR checkout may not contain that commit yet, so fetch it
      # explicitly from the production-lock.json value (never a floating ref).
      - name: Fetch accepted runtime commit for provenance gate
        run: |
          ACCEPTED=$(node -e "console.log(require('./docs/iris-fork/production-lock.json').acceptedRuntime.commit)")
          git fetch origin "$ACCEPTED" --depth=1
          git rev-parse "$ACCEPTED^{tree}"

      - name: Iris fork provenance gate
        run: npm run check:iris-fork

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test
